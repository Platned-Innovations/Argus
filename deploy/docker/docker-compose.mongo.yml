# Argus + MongoDB.
#   cp .env.example .env   # then set ARGUS_MASTER_KEY
#   docker compose -f deploy/docker/docker-compose.mongo.yml --env-file .env up -d --build
name: argus-mongo

services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: argus
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-argus-change-me}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  argus:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: argus:local
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - '${ARGUS_HTTP_PORT:-8080}:8080'
    environment:
      ARGUS_DB_TYPE: mongodb
      ARGUS_DB_URL: mongodb://argus:${MONGO_PASSWORD:-argus-change-me}@mongo:27017/?authSource=admin
      ARGUS_DB_NAME: argus
      ARGUS_MASTER_KEY: ${ARGUS_MASTER_KEY:?Set ARGUS_MASTER_KEY in .env (openssl rand -base64 48)}
      ARGUS_ADMIN_PASSWORD: ${ARGUS_ADMIN_PASSWORD:-}
      ARGUS_PUBLIC_URL: ${ARGUS_PUBLIC_URL:-http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ARGUS_AUTH_RATE_LIMIT: ${ARGUS_AUTH_RATE_LIMIT:-}
      ARGUS_WORKER_CONCURRENCY: ${ARGUS_WORKER_CONCURRENCY:-}
      ARGUS_SCAN_TIMEOUT_MINUTES: ${ARGUS_SCAN_TIMEOUT_MINUTES:-}
      ARGUS_SCHEDULER_INTERVAL_SECONDS: ${ARGUS_SCHEDULER_INTERVAL_SECONDS:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      NODE_USE_ENV_PROXY: ${NODE_USE_ENV_PROXY:-}
      ARGUS_OFFLINE: ${ARGUS_OFFLINE:-}
      ARGUS_OSV_URL: ${ARGUS_OSV_URL:-}
      ARGUS_NPM_REGISTRY_URL: ${ARGUS_NPM_REGISTRY_URL:-}
      ARGUS_NUGET_URL: ${ARGUS_NUGET_URL:-}

volumes:
  mongo-data:
